[package]
name = "sdrk-testkit"
description = "SDRk testkit: generators, virtual devices, loopback and the on-target test suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sdrk = { path = "../../facade/sdrk" }
sdrk-blocks = { path = "../../blocks/sdrk-blocks" }
sdrk-core = { path = "../../core/sdrk-core", features = ["reference"] }
sdrk-device = { path = "../../core/sdrk-device" }
sdrk-proto = { path = "../../proto/sdrk-proto" }
num-complex.workspace = true
libm.workspace = true
bytemuck.workspace = true
heapless.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
sha2 = "0.10.9"

# The name of the SIMD level for the baselines of M44.1 (`sdrk_testkit::baseline`); only the
# facade and test code may depend on a backend.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dev-dependencies]
sdrk-backend-simd = { path = "../../backends/sdrk-backend-simd", features = ["std"] }

[features]
std = ["dep:serde", "dep:serde_json", "sdrk/std"]

[lints]
workspace = true
