# SDRk pipeline: receive on-off keyed packets (YAML twin of ook_receiver.json). YAML is accepted
# as input; JSON stays the canonical format.
#
# On-off keying switches the carrier on for a 1 and off for a 0. Cheap 433 MHz and 868 MHz
# devices (weather sensors, remote controls, door bells) use it, each with its own bit coding
# and framing. This flow shows the chain with the test framing of frame_encode (4 preamble
# bytes 0x55, the sync word 0x1ACFFC1D, length, payload and CRC-16) at 2000 bit/s: channel
# filter, OOK demodulator and frame_decode. A real device needs its own decoder in place of
# frame_decode; the soft bits of ook_demod are the raw bits for it (> 0 is carrier on).
sdrk: 1
name: ook-receiver
description: "Receive on-off keyed packets of the test framing at 2000 bit/s from a 1 MS/s unsigned 8-bit baseband."
# f32 pipeline (the OOK kinds have no Q15 variant); at most 4096 samples per push.
settings:
  precision: f32
  max_chunk: 4096
inputs:
  # Unsigned 8-bit IQ at 1 MS/s (RTL-SDR) with the transmitter near 0 Hz. Cheap transmitters
  # are often 10 kHz or more off; the magnitude detector of ook_demod does not care where in
  # the channel the carrier is.
  rf:
    format: cu8
    rate_hz: 1000000
    description: "IQ at 1 MS/s with the transmitter near 0 Hz"
nodes:
  # Decoder of the test framing: finds the sync word in the soft bits (> 0 is a 1) and outputs
  # every packet whose CRC matches, with the flag CRC_OK.
  dec:
    kind: frame_decode
  # OOK demodulator at 125 samples per symbol (250 kHz / 2000 bit/s): the magnitude, a boxcar
  # matched filter of 125 taps, the Gardner timing loop and one soft bit per symbol: the value
  # minus the threshold at 0.45 of the way from the tracked off to the on level
  # (track_symbols 32, the default; 8 follows short bursts faster).
  demod:
    kind: ook_demod
    params:
      symbol_rate_hz: 2000
  # Digital down converter: decimate by 4 (1 MS/s -> 250 kHz) with a 15 kHz channel filter
  # whose stop band starts at 25 kHz (transition 10 kHz; the default transition of 25 kHz
  # would let the noise up to 40 kHz through). The magnitude is taken before the matched
  # filter of ook_demod, so all the noise inside the channel filter reaches the decision:
  # 15 kHz keeps a transmitter 10 kHz off (a common error of cheap devices) in the pass band
  # and lets far less noise through than the 50 kHz first planned (packet error rate below
  # 1 % at Eb/N0 15 dB instead of about 27 %). A wider cutoff catches devices further off
  # frequency at the price of sensitivity. Set frequency_hz to the offset of the transmitter
  # from the tuner centre.
  tune:
    kind: ddc
    params:
      cutoff_hz: 15000
      decimation: 4
      transition_hz: 10000
# Channel filter, demodulator, decoder.
edges:
  - { from: rf, to: tune }
  - { from: tune, to: demod }
  - { from: demod, to: dec }
  - { from: dec, to: packets }
outputs:
  # The decoded packets; the reader empties the queue after every push.
  packets:
    type: packets
    queue: 64
    description: "The decoded packets with CRC_OK and the input index of their sync word"
