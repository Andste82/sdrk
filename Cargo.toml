[workspace]
resolver = "3"
members = [
    "crates/core/sdrk-device",
    "crates/core/sdrk-core",
    "crates/backends/sdrk-backend-simd",
    "crates/facade/sdrk",
    "crates/blocks/sdrk-blocks",
    "crates/pipeline/sdrk-pipeline",
    "crates/io/sdrk-io",
    "bindings/wasm",
    "examples/fm-receiver",
    "examples/fm-transmitter",
    "tests/system",
    "crates/testing/sdrk-testkit",
    "xtask",
]

exclude = ["crates/pipeline/sdrk-pipeline/fuzz", "benches", "targets/*"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Andste82/sdrk"
version = "0.1.0"

[workspace.dependencies]
num-complex = { version = "0.4.6", default-features = false, features = ["bytemuck"] }
libm = "0.2.16"
bytemuck = { version = "1.25.2", features = ["derive"] }
heapless = "0.9.3"

[workspace.lints.rust]
# `--cfg sdrk_fallback_only` (RUSTFLAGS) forces the portable fallback everywhere (M13).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sdrk_fallback_only)'] }
# `deny`, not `forbid`: backend crates later allow unsafe locally.
# Every non-backend library crate adds `#![forbid(unsafe_code)]` itself.
unsafe_code = "deny"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
large_stack_frames = "deny"
large_stack_arrays = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that conflict with the numeric rules (R7 prescribes explicit casts).
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
# `as_chunks` returns array chunks that the kernels would have to index again; the length of
# the chunk is a vector width in the backends and a format constant in the converters.
chunks_exact_to_as_chunks = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
overflow-checks = true

# The SIMD backend is unusably slow without optimisation (every vector operation is a call), so
# it and the vector library are optimised in the dev and test profiles as well.
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.sdrk-backend-simd]
opt-level = 3

[profile.test]
overflow-checks = true

# Test runs in emulators (QEMU, Intel SDE): optimised so that the end-to-end tests finish, but
# without the whole-program build time of `release`.
[profile.emulated]
inherits = "release"
lto = false
codegen-units = 16
overflow-checks = true

[profile.release]
overflow-checks = false
lto = "thin"
codegen-units = 1
