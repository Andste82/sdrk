# SDRk pipeline: receive one narrow-band FM channel with a squelch (YAML twin of
# nfm_receiver.json). YAML is accepted as input; JSON stays the canonical format.
sdrk: 1
name: nfm-receiver
description: "Receive one narrow-band FM channel with a power squelch and output 48 kHz audio."
# f32 pipeline; at most 4096 samples per push.
settings:
  precision: f32
  max_chunk: 4096
# RTL-SDR recording: unsigned 8-bit IQ at 2.4 MS/s.
inputs:
  rf:
    format: cu8
    rate_hz: 2400000
    description: "RTL-SDR IQ"
nodes:
  # CTCSS removal: a 4th-order Butterworth high-pass at 300 Hz after the demodulator. Two-way
  # radio often carries a sub-audible tone (CTCSS, 67 to 254 Hz) that opens the squelch of the
  # other radios; it is part of the demodulated signal and would be audible as a hum. Voice
  # for communication needs 300 Hz and above, so the high-pass removes the tone and keeps the
  # speech. cutoff_hz can be changed while the flow runs (set_param); the filter keeps its
  # state. At the squelch the audio is exact silence (f32); in a Q15 pipeline the
  # de-emphasis and this filter may keep a small constant rest of a few LSB after the gate
  # closes.
  ctcss:
    kind: biquad
    params:
      cutoff_hz: 300
      order: 4
      response: highpass
  # Quadrature FM demodulation with a 530 us de-emphasis: two-way radio transmits audio with
  # a pre-emphasis of 6 dB per octave from 300 Hz (ETSI EN 300 086, 1 / (2 pi * 300 Hz) =
  # 530 us; TIA-603 radios use 750 us), and the nfm_transmitter flow does the same. Set
  # deemphasis_us to 0 for a transmitter without pre-emphasis. deviation_hz is the deviation
  # that reads full scale: 5000 for 25 kHz channels, 2500 for 12.5 kHz channels.
  # audio_cutoff_hz only matters when audio_decimation is above 1; the channel is already at
  # 48 kHz here.
  demod:
    kind: fm_demod
    params:
      audio_cutoff_hz: 4000
      deemphasis_us: 530
      deviation_hz: 5000
  # Power squelch with the defaults: it opens at -40 dBFS, closes 3 dB lower and averages the
  # power over 10 ms. While it is closed the audio is exact silence. It sits after the channel
  # filter and before the demodulator; threshold_db and hysteresis_db can be changed while the
  # flow runs (set_param), tau_s only at build time.
  gate:
    kind: squelch
  # Digital down converter: decimate by 50 (2.4 MS/s -> 48 kHz) with an 8 kHz channel filter.
  # Set frequency_hz to the offset of the channel from the tuner centre. Rule of thumb: the
  # cutoff is the deviation plus the highest audio frequency (about 3 kHz), half the
  # necessary bandwidth of the channel (16 kHz for 25 kHz channels with 5 kHz deviation). A
  # narrower filter cuts the FM sidebands and distorts the audio (6 kHz here gives about
  # 22 dB SINAD instead of 35 dB). For 12.5 kHz channels (deviation_hz 2500) use cutoff_hz
  # 6000 and transition_hz 3000. The narrow transition at 2.4 MS/s needs about 2200 taps
  # (2900 for the 12.5 kHz values), more than the default max_taps of 1023, so max_taps is
  # raised.
  tune:
    kind: ddc
    params:
      cutoff_hz: 8000
      decimation: 50
      max_taps: 4096
      transition_hz: 4000
# Channel filter, squelch, demodulator, CTCSS high-pass.
edges:
  - { from: rf, to: tune }
  - { from: tune, to: gate }
  - { from: gate, to: demod }
  - { from: demod, to: ctcss }
  - { from: ctcss, to: audio }
# Audio samples (errors when full).
outputs:
  audio:
    type: stream
    capacity: 16384
    drop: error
