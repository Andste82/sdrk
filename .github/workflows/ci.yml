name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  tier1:
    name: tier1 (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        # Without arguments rustup installs the toolchain, components and targets
        # listed in rust-toolchain.toml.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Pipeline tests without YAML
        run: cargo test -p sdrk-pipeline --no-default-features
      - name: Architecture checks
        run: cargo xtask check
      - name: Bare-metal build
        run: cargo xtask bare-metal
      - name: Pipeline schema is up to date
        run: cargo xtask schema --check
      - uses: taiki-e/install-action@cargo-deny
      - name: Dependency policy
        run: cargo deny check

  golden-check:
    name: golden-check
    # On changes under tests/golden/** (the paths are checked in the first step) and nightly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the golden files changed
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$base" "${{ github.sha }}" | grep -q '^tests/golden/'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install pinned requirements
        if: steps.changed.outputs.run == 'true'
        run: pip install -r tests/golden/requirements.txt
      - name: Check committed vectors
        if: steps.changed.outputs.run == 'true'
        run: python tests/golden/generate.py --check

  fuzz:
    name: fuzz (pipeline_json, linux-x86_64)
    # Nightly only, five minutes, Linux x86_64 only: fuzzing is not required on Windows and
    # arm64.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz from_json, validate and build for five minutes
        working-directory: crates/pipeline/sdrk-pipeline
        run: cargo +nightly fuzz run pipeline_json -- -max_total_time=300
