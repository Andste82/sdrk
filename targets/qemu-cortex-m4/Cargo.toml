# The testkit suite on a Cortex-M4F in QEMU (machine mps2-an386), every commit.
[package]
name = "sdrk-target-qemu-cortex-m4"
description = "SDRk on-target suite for QEMU mps2-an386 (Cortex-M4F)."
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

# A project of its own, outside the main workspace.
[workspace]

[dependencies]
sdrk-target-common = { path = "../common" }
sdrk-testkit = { path = "../../crates/testing/sdrk-testkit" }
sdrk-blocks = { path = "../../crates/blocks/sdrk-blocks" }
sdrk = { path = "../../crates/facade/sdrk" }
sdrk-device = { path = "../../crates/core/sdrk-device" }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
heapless = "0.9.3"

[features]
# Run every case (the default is the quick tier).
full = ["sdrk-target-common/full"]
# Append one always-failing case; the host must report the run as failed.
inject-failure = []

[profile.emu]
inherits = "release"
overflow-checks = true
debug-assertions = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
