[package]
name = "kernels"
description = "Instruction-count measurements of the SDRk kernels against VOLK, rustfft, FFTW, KissFFT, Ne10, GNU Radio, KFR and CMSIS-DSP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "count"
path = "src/bin/count.rs"

[dependencies]
# The kernels as users call them: through the facade. The feature `std` selects the SIMD level
# at run time (the level `avx2-runtime`); without it the level is fixed at compile time by
# `-C target-cpu`.
sdrk = { path = "../../crates/facade/sdrk" }
# `std` on every level: the binary links the standard library, so the fallback takes its square
# roots from it as on every host build with `std` (`sdrk_core::num::sqrt_f32`); the `no_std`
# form (`libm`) is counted by the embedded suites.
sdrk-core = { path = "../../crates/core/sdrk-core", features = ["reference", "std"] }
sdrk-device = { path = "../../crates/core/sdrk-device" }
sdrk-backend-simd = { path = "../../crates/backends/sdrk-backend-simd" }
rustfft = "6.4"
# The real-input FFT on top of rustfft (its author's `RealFftPlanner`), the reference of `rfft`.
realfft = "3.5"
serde_json = "1.0"
volk-sys = { path = "../volk-sys" }
cref-sys = { path = "../cref-sys" }

# On wasm32 rustfft uses its SIMD128 planner only with this feature (otherwise it is scalar).
[target.'cfg(target_arch = "wasm32")'.dependencies]
rustfft = { version = "6.4", features = ["wasm_simd"] }

[features]
default = []
std = ["sdrk/std"]
