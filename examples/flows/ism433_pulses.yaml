# SDRk pipeline: the pulse trains of every short-range device in the 433 MHz ISM band at once
# (YAML twin of ism433_pulses.json). YAML is accepted as input; JSON stays the canonical format.
#
# The band 433.05 ... 434.79 MHz (1.74 MHz) lies inside +-1 MHz of 433.92 MHz, so one RTL-SDR at
# 2 MS/s centred at 433.92 MHz sees all of it. Cheap sensors, remote controls and door contacts
# use crystals or SAW resonators that are tens of kHz off, so their frequency is unknown: a
# channelizer splits the band into 16 overlapping channels of 125 kHz (each passes +-62.5 kHz
# flat), and band_pulse_detect runs a pulse detector in every channel, merges what neighbouring
# channels see of the same transmission and emits each transmission as one pulse train.
#
# HackRF variant: the same flow with `format: cs8` (signed 8-bit IQ) at the same rate.
sdrk: 1
name: ism433-pulses
description: "Detect every short-range transmission in the 433 MHz ISM band (433.05 to 434.79 MHz) at once: a 16-channel polyphase channelizer and a pulse detector in every channel, the pulse trains as packets."
# f32 pipeline; at most 4096 samples per push.
settings:
  precision: f32
  max_chunk: 4096
inputs:
  # RTL-SDR: unsigned 8-bit IQ at 2 MS/s centred at 433.92 MHz (the automatic rf__convert turns
  # it into c32). For a HackRF write `format: cs8`.
  rf:
    format: cu8
    rate_hz: 2000000
    description: "RTL-SDR IQ at 2 MS/s centred at 433.92 MHz"
nodes:
  # 16 channels 125 kHz apart, each at 250 kS/s (twice the spacing), the search grid: flat to
  # half the spacing, 60 dB down from one spacing, so a transmitter anywhere in the band lies in
  # the flat pass band of at least one channel. Channel c (-8 ... 7) is at 433.92 MHz + c * 125 kHz.
  chan:
    kind: channelize
    params:
      channels: 16
      taps_per_branch: 8
  # The pulse detector in every channel (OOK and FSK, modulation auto, a burst starts 9 dB above
  # the noise; min_snr_db can be changed while the flow runs). center_hz only sets the absolute
  # frequency of the packets (freq_hz of the JSON form of sdrk_proto::pulses).
  det:
    kind: band_pulse_detect
    params:
      center_hz: 433920000
edges:
  - { from: rf, to: chan }
  - { from: chan, to: det }
  - { from: det, to: pulses }
outputs:
  # One train per transmission (sdrk_proto::pulses: modulation, channel, frequency offset, level,
  # noise, the widths in steps of 250 kHz); a train of more than 30 pulses comes as several
  # packets with the flag CONTINUED (sdrk_proto::pulses::Assembler joins them). The index is the
  # start of the burst in steps of 250 kHz.
  pulses:
    type: packets
    queue: 4096
    description: "Pulse trains (sdrk_proto::pulses), indexed in steps of 250 kHz"
