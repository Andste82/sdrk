# SDRk pipeline: QPSK packet receiver (YAML twin of qpsk_receiver.json), the counterpart of
# qpsk_transmitter: 1 MS/s IQ in, the packets of the test framing out.
sdrk: 1
name: qpsk-receiver
description: "Receive QPSK at 25 kBd from a 1 MHz baseband: down converter, automatic gain control, demodulator with symbol timing and carrier recovery, and the decoded packets of the test framing."
settings:
  precision: f32
  max_chunk: 4096
inputs:
  rf:
    format: cs16
    rate_hz: 1000000
    description: "IQ at 1 MS/s with the signal at 0 Hz"
nodes:
  # Automatic gain control to amplitude 1 (reference 0 dB): the demodulator expects the
  # symbols near unit amplitude, and the gains of its carrier loop scale with the amplitude.
  # The default reference of -6 dB halves the loop gains and slows the acquisition.
  agc:
    kind: agc
    params:
      reference_db: 0
  # Decoder: max_sync_errors 2 accepts a sync word with up to 2 wrong bits on a noisy link.
  # polarity both also accepts the inverted sync word and inverts the frame: the carrier loop
  # may lock 180 degrees off. A lock 90 or 270 degrees off swaps and inverts the bits of the
  # pairs, which polarity both does not resolve; the receiver then decodes nothing until the
  # loop slips (use differential: true on both sides where that matters).
  dec:
    kind: frame_decode
    params:
      max_sync_errors: 2
      polarity: both
  # Demodulator: root-raised-cosine matched filter (roll-off 0.35, span 10, as the
  # transmitter), Gardner symbol timing (sync_bw 0.01) and the Costas loop of order 4. The
  # carrier loop is wider than the default (carrier_bw 0.04 instead of 0.02) and its frequency
  # limit is 0.1 cycles per symbol (2.5 kHz at 25 kBd, default 0.05): a carrier 2 kHz off is
  # 0.08 cycles per symbol, ten times the hold-in range of the default loop.
  demod:
    kind: psk_demod
    params:
      carrier_bw: 0.04
      max_offset: 0.1
      order: 4
      symbol_rate_hz: 25000
  # Down converter: /5 to 200 kHz (8 samples per symbol). The channel filter passes 20 kHz
  # and stops from 80 kHz; the matched filter of the demodulator does the rest.
  tune:
    kind: ddc
    params:
      cutoff_hz: 50000
      decimation: 5
      transition_hz: 60000
edges:
  - { from: rf, to: tune }
  - { from: tune, to: agc }
  - { from: agc, to: demod }
  - { from: demod, to: dec }
  - { from: dec, to: packets }
outputs:
  # The decoded packets, with CRC_OK and the soft-bit index of their sync word (50000 bit/s).
  packets:
    type: packets
    queue: 1024
    description: "The decoded packets with CRC_OK and the sample index of their sync word"
