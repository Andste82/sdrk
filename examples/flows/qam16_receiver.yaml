# SDRk pipeline: 16-QAM packet receiver (YAML twin of qam16_receiver.json), the counterpart of
# qam16_transmitter: 1 MS/s IQ in, the packets of the test framing out.
sdrk: 1
name: qam16-receiver
description: "Receive 16-QAM at 25 kBd from a 1 MHz baseband: down converter, automatic gain control, and qam_frame_decode (symbol timing, equalizer, carrier recovery and the decoded packets of the test framing, with a watch at frame level)."
settings:
  precision: f32
  max_chunk: 4096
inputs:
  rf:
    format: cs16
    rate_hz: 1000000
    description: "IQ at 1 MS/s with the signal at 0 Hz"
nodes:
  # Automatic gain control to the unit average power that qam_demod expects (reference -3 dB:
  # the AGC settles the amplitude of the samples, and the pulse-shaped 16-QAM signal at
  # amplitude 1 has an average power of about 1.9; M44.3, D2423) with equal attack and release
  # time constants of 20 ms (500 symbols): the amplitude of 16-QAM changes from symbol to
  # symbol, and an AGC that followed it (the default attack of 5 ms against a release of
  # 200 ms pulls the level down on every outer point) would distort the constellation; 100 ms
  # as in qam256_receiver lost 16 packets of the flow test in one burst (D2426). The equalizer
  # of the demodulator sets the exact scale.
  agc:
    kind: agc
    params:
      attack_s: 0.02
      reference_db: -3
      release_s: 0.02
  # Demodulator, descrambler and decoder in one block (qam_frame_decode = qam_demod ->
  # bit_descramble -> frame_decode, M44.1, the descrambler since M44.2). Demodulator:
  # root-raised-cosine matched filter (roll-off 0.35, span 10, as the transmitter), Gardner
  # symbol timing, the frequency acquisition (a fourth-power estimate of
  # the carrier offset, up to +-0.125 cycles per symbol = +-3.1 kHz at 25 kBd), the blind
  # equalizer (1000 CMA symbols, then decision-directed with mu_dd 0.005 and a narrow phase
  # tracker) and the decision-directed carrier loop of 16-QAM with the default carrier_bw
  # 0.0025 (D1618, D1622): the acquisition hands the offset to the loops, so they need no wide
  # bandwidth for a carrier 1 kHz off. The values that differ from the defaults:
  # - equalizer_taps 15 (default 11): the multipath of the test channel reaches 2.7 symbols.
  # - sync_bw 0.002 (default 0.005 for 16-QAM): less timing jitter on 16-QAM.
  # Descrambler (scrambler multiplicative, polynomial x23_x18, the defaults, as the
  # transmitter): it locks by itself after 23 symbols; its delays count whole symbols, so the
  # quarter turns of the carrier loop pass through it and the decoder resolves them.
  # Decoder: rotations four with the constellation of the node (4 bits per symbol for qam16)
  # tests the sync word in the four rotations of the 16-QAM symbols: the decision-directed carrier loop
  # may lock 0, 90, 180 or 270 degrees off, and the decoder undoes the rotation it found; the
  # quarter turns are reported in bits 16 and 17 of the packet flags. max_sync_errors 2 accepts
  # a sync word with up to 2 wrong bits on a noisy link.
  # Frame watch: after a first packet with CRC_OK, no packet with CRC_OK for frame_timeout
  # symbols (16384, the default, about 0.66 s at 25 kBd) starts the demodulator again; it takes
  # a receiver out of a state in which it delivers nothing although the signal is there. A
  # sender that pauses longer between packets (with the idle signal on the air) only costs a
  # new acquisition; frame_timeout 0 turns the watch off.
  rx:
    kind: qam_frame_decode
    params:
      constellation: qam16
      equalizer_taps: 15
      frame_timeout: 16384
      max_sync_errors: 2
      symbol_rate_hz: 25000
      sync_bw: 0.002
  # Down converter: /5 to 200 kHz (8 samples per symbol). The channel filter passes 20 kHz
  # and stops from 80 kHz; the matched filter of the demodulator does the rest.
  tune:
    kind: ddc
    params:
      cutoff_hz: 50000
      decimation: 5
      transition_hz: 60000
edges:
  - { from: rf, to: tune }
  - { from: tune, to: agc }
  - { from: agc, to: rx }
  - { from: rx, to: packets }
outputs:
  # The decoded packets, with CRC_OK, the rotation and the index of the 200 kHz input sample of
  # the demodulator at the first symbol of their sync word.
  packets:
    type: packets
    queue: 1024
    description: "The decoded packets with CRC_OK and the input sample index of their sync word"
