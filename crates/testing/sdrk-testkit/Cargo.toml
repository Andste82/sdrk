[package]
name = "sdrk-testkit"
description = "SDRk testkit: generators, virtual devices, loopback and the on-target test suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sdrk = { path = "../../facade/sdrk" }
sdrk-core = { path = "../../core/sdrk-core", features = ["reference"] }
sdrk-device = { path = "../../core/sdrk-device" }
num-complex.workspace = true
libm.workspace = true
bytemuck.workspace = true
heapless.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"

[features]
std = ["dep:serde", "dep:serde_json"]

[lints]
workspace = true
