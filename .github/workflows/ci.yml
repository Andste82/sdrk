name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  tier1:
    name: tier1 (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target thumbv7em-none-eabihf --target wasm32-unknown-unknown --target wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Architecture checks
        run: cargo xtask check
      - name: Bare-metal build
        run: cargo xtask bare-metal
      - uses: taiki-e/install-action@cargo-deny
      - name: Dependency policy
        run: cargo deny check
