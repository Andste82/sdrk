[package]
name = "sdrk-blocks"
description = "SDRk blocks: filter design, storage abstraction and self-describing signal-processing blocks (heap-free)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Forwards `sdrk/std`: run-time CPU detection in the SIMD backend (and the standard-library square
# roots of the fallback, D67) for a crate that depends on `sdrk-blocks` alone. The crate itself
# stays `no_std`; the feature only forwards (D3163).
std = ["sdrk/std"]

[dependencies]
sdrk = { path = "../../facade/sdrk" }
sdrk-core = { path = "../../core/sdrk-core" }
sdrk-device = { path = "../../core/sdrk-device" }
sdrk-proto = { path = "../../proto/sdrk-proto" }
libm.workspace = true
bytemuck.workspace = true
heapless.workspace = true

[dev-dependencies]
num-complex.workspace = true
sdrk-testkit = { path = "../../testing/sdrk-testkit", features = ["std"] }

[lints]
workspace = true
