# Pull requests run the CI tree (tree.yml) with scope `pr`; a push to main runs `smoke`
# only, because the pull request has already tested the same tree (branches must be up to
# date before they are merged). The nightly run is nightly.yml. docs/testing.md describes
# the jobs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: the label `ci:full` runs the whole tree (scope `full`) on the pull request.
    types: [opened, synchronize, reopened, labeled]

# A newer push to a pull request makes the older run obsolete. main is never cancelled, so
# every commit on main keeps a result.
concurrency:
  # A label other than `ci:full` starts a run that does nothing; its own group keeps it from
  # cancelling the run in progress.
  group: >-
    ci-${{ github.event_name }}-${{ github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'ci:full'
    && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: x64-linux-smoke
      - name: Build
        run: cargo build --workspace --all-targets --all-features
      - name: Architecture checks
        run: cargo xtask check
      - name: Bare-metal build
        run: cargo xtask bare-metal
      - name: Quick test (unit tests of the libraries)
        run: cargo test --workspace --all-features --lib

  scope:
    # What the pull request changed: decides which parts of the tree run.
    name: scope
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      run_count: ${{ steps.scope.outputs.run_count }}
      run_golden: ${{ steps.scope.outputs.run_golden }}
      run_selfcheck: ${{ steps.scope.outputs.run_selfcheck }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed files
        id: scope
        shell: bash
        env:
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE" "$GITHUB_SHA" > changed.txt
          echo "Changed files:"; cat changed.txt
          # Markdown files that a test reads (the generated block table).
          tested_md='^docs/blocks\.md$'
          has() { grep -qE "$1" changed.txt; }
          docs_only=true
          if grep -vE '\.md$' changed.txt | grep -q . || has "$tested_md"; then docs_only=false; fi
          code_or_ci='^(\.github/|Cargo\.lock$|rust-toolchain\.toml$|deny\.toml$)'
          run_count=false; has "^(crates/(core|backends|facade)/|benches/|xtask/)" && run_count=true; has "$code_or_ci" && run_count=true
          run_golden=false; has '^tests/golden/' && run_golden=true; has '^\.github/' && run_golden=true
          run_selfcheck=false; has '^(xtask/|targets/|\.github/)' && run_selfcheck=true
          scope="pr"
          if [ "$FULL" = "true" ]; then
            scope="full"; docs_only=false; run_count=true; run_golden=true; run_selfcheck=true
          fi
          {
            echo "scope=$scope"
            echo "docs_only=$docs_only"
            echo "run_count=$run_count"
            echo "run_golden=$run_golden"
            echo "run_selfcheck=$run_selfcheck"
          } | tee -a "$GITHUB_OUTPUT"

  tree:
    needs: scope
    uses: ./.github/workflows/tree.yml
    secrets: inherit
    with:
      scope: ${{ needs.scope.outputs.scope }}
      docs_only: ${{ needs.scope.outputs.docs_only == 'true' }}
      run_count: ${{ needs.scope.outputs.run_count == 'true' }}
      run_golden: ${{ needs.scope.outputs.run_golden == 'true' }}
      run_selfcheck: ${{ needs.scope.outputs.run_selfcheck == 'true' }}
