[package]
name = "sdrk-backend-simd"
description = "SDRk SIMD backend: SSE2, AVX2, AVX-512, NEON and SIMD128 kernels (heap-free)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sdrk-core = { path = "../../core/sdrk-core" }
sdrk-device = { path = "../../core/sdrk-device" }
bytemuck.workspace = true
libm.workspace = true
fearless_simd = { version = "1.1.0", default-features = false, features = ["libm"] }

[build-dependencies]
libm.workspace = true

[dev-dependencies]
sdrk-core = { path = "../../core/sdrk-core", features = ["reference", "static-twiddles"] }

[features]
default = []
# Runtime CPU-feature detection at every kernel entry (x86-64: SSE2, AVX2 + FMA, AVX-512).
# Without it the SIMD level is fixed at compile time by `-C target-cpu` / `target-feature`.
std = ["fearless_simd/std"]
# On wasm32 built with the target feature `relaxed-simd`: the C32 variants of `fir`,
# `fir_decimate` and `fir_interpolate` use relaxed multiply-add (M14). Not bit-exact; a no-op on
# every other target.
relaxed-simd = []
# Static per-span twiddle tables of the C32 FFT (spans 8 to 4096, 41 KiB of read-only data): no
# twiddle gathers or products in the passes, exact `W^3k`. The facade enables it on x86-64 and
# AArch64; without it the passes take every twiddle from the plan.
fft-tables = []
# Static interpolation tables of the NCO lookups (64 KiB f32, 32 KiB Q15 of read-only data): one
# load per sample in `fm_mod` and in the CQ15 `rotate`. The facade enables it on x86-64 and
# AArch64; without it the lookups read the cosine tables of `sdrk-core`.
nco-tables = []

[lints]
workspace = true
