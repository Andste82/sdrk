[package]
name = "sdrk-core"
description = "SDRk core: sample types, kernel traits, reference and fallback kernels (heap-free)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sdrk-device = { path = "../sdrk-device" }
num-complex.workspace = true
bytemuck.workspace = true
libm.workspace = true

[build-dependencies]
libm.workspace = true

[features]
default = []
# Executable specification (f64 / exact integer model); used by the testkit and tests only.
reference = []
# Emits the 4096-point twiddle tables (16 KiB C32, 8 KiB CQ15 of flash) for `FftPlan::from_static_4096`.
static-twiddles = []
# The square roots of `num::sqrt_f32` / `sqrt_f64` (`mag`, `agc`) from `f32::sqrt` / `f64::sqrt`
# of the standard library instead of `libm`: the same bits, but LLVM's own instruction, which
# the compiler vectorizes. Nothing else may use `std` (D67, enforced by `cargo xtask check`; any
# other use needs a maintainer decision); the crate stays heap-free.
std = []

[lints]
workspace = true
