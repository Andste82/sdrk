[graph]
all-features = true

[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The RTL-SDR driver of `crates/drivers/sdrk-rtlsdr` (decision D1709): MPL-2.0 is copyleft per
# file only; SDRk uses the crate unmodified, so its own code keeps MIT OR Apache-2.0.
exceptions = [
    { allow = ["MPL-2.0"], crate = "rtl-sdr-rs" },
]

[bans]
multiple-versions = "warn"
