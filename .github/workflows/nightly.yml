# The nightly run: the whole CI tree (tree.yml) with scope `full`, that is every pull-request
# job plus the long jobs (sweeps, emulators with the full profile, the instruction counts of
# wasm32 and the Cortex-M4, fuzzing, the long run), and the cycle measurement of every entry
# (measure.yml, `measure_nightly`, D2709). By hand on a branch, `measure_only` runs the cycle
# measurement alone, of the entries `kernels` at the levels `levels` (`gh workflow run
# nightly.yml --ref <branch> -f measure_only=true -f kernels="fir agc" -f levels="avx2 neon"`). When main has not changed since the last green nightly run, the pull-request tests are skipped and
# only the long jobs run (except on Sunday, so that a change of the environment, a new
# toolchain or runner image, still shows within a week). A failure opens or updates an issue.
name: nightly

on:
  schedule:
    - cron: "17 3 * * 1-6"
    # Sunday: always with the pull-request tests.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      skip_pr_nodes:
        description: Skip the tests that every pull request runs.
        type: boolean
        default: false
      measure_only:
        description: Only the cycle measurement (measure_nightly), without the tree.
        type: boolean
        default: false
      kernels:
        description: "Cycle measurement: `all`, or kernel names separated by spaces."
        type: string
        default: all
      levels:
        description: "Cycle measurement: `all`, or levels separated by spaces."
        type: string
        default: all
      shards:
        description: "Cycle measurement: partitions per level when every entry is measured."
        type: number
        default: 4
      repeat:
        description: "Cycle measurement: every partition twice, identical results required (I13.1-1)."
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  delta:
    # Whether main changed since the last green nightly run.
    name: delta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      skip_pr_nodes: ${{ steps.delta.outputs.skip_pr_nodes }}
    steps:
      - name: Last green nightly run
        id: delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          SKIP_INPUT: ${{ inputs.skip_pr_nodes }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "$SKIP_INPUT" = "true" ] && skip=true
          elif [ "$SCHEDULE" != "17 3 * * 0" ]; then
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
            echo "last green nightly: ${last:-none}, now: $GITHUB_SHA"
            [ "$last" = "$GITHUB_SHA" ] && skip=true
          fi
          echo "skip_pr_nodes=$skip" | tee -a "$GITHUB_OUTPUT"

  tree:
    needs: delta
    if: ${{ !inputs.measure_only }}
    uses: ./.github/workflows/tree.yml
    secrets: inherit
    with:
      scope: full
      skip_pr_nodes: ${{ needs.delta.outputs.skip_pr_nodes == 'true' }}

  measure_nightly:
    # The scheduled runs have no inputs: every entry on every level.
    uses: ./.github/workflows/measure.yml
    with:
      kernels: ${{ inputs.kernels || 'all' }}
      levels: ${{ inputs.levels || 'all' }}
      shards: ${{ format('{0}', inputs.shards || 4) }}
      repeat: ${{ inputs.repeat == true }}

  report:
    # A failed nightly run opens an issue, or adds a comment to the open one.
    name: report
    needs: [tree, measure_nightly]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The nightly CI run failed" --force
          body="The nightly run failed on $GITHUB_SHA: $RUN_URL"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open \
            --json number --jq '.[0].number // ""')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly CI run failed" \
              --label nightly-failure --body "$body"
          fi
