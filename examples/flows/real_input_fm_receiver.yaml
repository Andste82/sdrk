# SDRk pipeline: receive one FM broadcast station from a real-sampling device
# (YAML twin of real_input_fm_receiver.json). JSON stays the canonical format.
sdrk: 1
name: real-input-fm-receiver
description: "Receive one FM broadcast station from a real-sampling device (4.8 MS/s, real 16-bit) and output 48 kHz audio."
# f32 pipeline; at most 4096 samples per push.
settings:
  precision: f32
  max_chunk: 4096
# Real 16-bit samples at 4.8 MS/s (the automatic convert node decodes them to f32).
inputs:
  rf:
    format: rs16
    rate_hz: 4800000
    description: "Real-sampling device, for example an Airspy R2"
nodes:
  # Shift by a quarter of the input rate and halve the rate: 4.8 MS/s real -> 2.4 MS/s complex.
  # The output centre (0 Hz) is the input frequency 1.2 MHz.
  iq:
    kind: real_to_complex
    params:
      attenuation_db: 60
      transition_hz: 480000
  # Digital down converter: a station at the real frequency f is tuned with f - 1.2 MHz.
  # The example station at 1.8 MHz gives +600 kHz.
  tune:
    kind: ddc
    params:
      cutoff_hz: 100000
      decimation: 10
      frequency_hz: 600000
  # Quadrature FM demodulation with 50 us de-emphasis, 240 kHz -> 48 kHz.
  demod:
    kind: fm_demod
    params:
      audio_decimation: 5
      deemphasis_us: 50
      deviation_hz: 75000
edges:
  - { from: rf, to: iq }
  - { from: iq, to: tune }
  - { from: tune, to: demod }
  - { from: demod, to: audio }
outputs:
  audio:
    type: stream
    capacity: 16384
    drop: error
