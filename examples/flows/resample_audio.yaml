# Resample audio (YAML twin of resample_audio.json).
sdrk: 1
name: resample-audio
description: "Convert real audio from 48 kHz to 44.1 kHz."
settings:
  precision: f32
  max_chunk: 4096
inputs:
  audio_in:
    type: f32
    rate_hz: 48000
    description: "Real audio samples"
nodes:
  # Rational resampler 147/160: the 44.1 kHz rate is exact.
  to_cd:
    kind: resample
    params:
      max_taps: 8192
      rate_out_hz: 44100
# Clock drift: the sound card that plays the 44.1 kHz audio has its own quartz, so
# its rate differs from the rate of the source by some ppm and a buffer between the
# two slowly runs over or dry. To follow the drift:
#   1. Set `tunable: true` in the params of `to_cd` (a build parameter; it
#      makes the resampler accept a runtime `ppm` of plus or minus 1000).
#   2. Create a `PipelineDrift` for the output `audio_out` and the node `to_cd`
#      with a `DriftConfig::new(44100.0, target_samples)`.
#   3. Call `drift.update(&mut pipeline, now_s, extra_fill)` immediately before
#      every push to `audio_in` and immediately before every read of `audio_out`
#      (calling it only after each read makes the fill jump by a whole block when
#      the two clocks slip). It sets `ppm` of `to_cd` from the fill level of
#      `audio_out` plus `extra_fill` (samples held outside the pipeline). The defaults (30 s time constant, at most 500 ppm, at most
#      20 ppm per second) change the pitch too slowly to hear.
# See docs/blocks.md (section "Clock drift").
# Audio in, one resampler, audio out.
edges:
  - { from: audio_in, to: to_cd }
  - { from: to_cd, to: audio_out }
outputs:
  audio_out:
    type: stream
    capacity: 16384
    drop: error
